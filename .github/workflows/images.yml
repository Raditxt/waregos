name: images

# Build image Docker dan push ke GHCR (ADR 0006).
# Tag = SHA commit penuh, tanpa `latest`. Produksi hanya memakai image dari `main`;
# image dari workflow_dispatch di branch lain hanya untuk uji.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Harus sama dengan `x-api-image` di deploy/compose.yaml. GHCR wajib huruf kecil.
  API_IMAGE: ghcr.io/raditxt/waregos-api

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Siapkan Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login ke GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tidak ada build-arg. Rahasia tidak boleh masuk image (cek dengan `docker history --no-trunc`).
      - name: Build dan push image API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Ringkasan
        run: |
          echo "Image API: \`${API_IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  # --- Tempat image backup (tiket VM-05, ADR 0007) ---
  # Tambahkan job `backup` di sini dengan pola yang sama: permissions per job,
  # tag = SHA commit, base image = tag Postgres yang sama dengan service `db`
  # (sumber tunggalnya diputuskan di VM-05).
