# Stack produksi Waregos di VPS (ADR 0006, 0008).
# Jalankan dari /srv/waregos:
#   docker compose -f repo/deploy/compose.yaml --env-file .env <perintah>
#
# Invariant ADR 0008: db dan api TIDAK punya `ports:`, dan network `internal`
# hanya berisi db, api, backup, cloudflared. Ubah file ini = ulangi
# verifikasi ADR 0008.
# Tidak ada `logging:`: daemon Docker di VPS sudah memakai driver `local` 10 MB x 3.

name: waregos

x-api-image: &api-image ghcr.io/raditxt/waregos-api:${API_IMAGE_TAG:?isi API_IMAGE_TAG di .env}

services:
  db:
    image: postgres:${POSTGRES_TAG:?isi POSTGRES_TAG di .env}
    restart: unless-stopped
    environment:
      POSTGRES_DB: waregos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?isi POSTGRES_SUPERUSER_PASSWORD di .env}
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - max_connections=30
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waregos"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  api:
    image: *api-image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      DATABASE_URL: postgresql://waregos_app:${WAREGOS_APP_PASSWORD:?isi WAREGOS_APP_PASSWORD di .env}@db:5432/waregos?schema=public
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?isi CORS_ORIGINS di .env}
      # Diabaikan image lama; dipakai setelah tiket 02. Harus sama dengan subnet di bawah.
      TRUST_PROXY_CIDRS: 10.89.10.0/24
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:?isi CLOUDFLARED_TAG di .env}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Kosong di laptop tidak apa-apa selama cloudflared tidak dinyalakan.
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
    mem_limit: 128m
    networks:
      - internal

  # Sekali jalan, manual: docker compose ... --profile ops run --rm migrate
  # Tidak pernah ikut `up`. Seed TIDAK pernah dijalankan di VPS.
  migrate:
    image: *api-image
    profiles: ["ops"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app/packages/database
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://waregos_owner:${WAREGOS_OWNER_PASSWORD:?isi WAREGOS_OWNER_PASSWORD di .env}@db:5432/waregos?schema=public
      DIRECT_URL: postgresql://waregos_owner:${WAREGOS_OWNER_PASSWORD}@db:5432/waregos?schema=public
    command: ["/app/node_modules/.bin/prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    networks:
      - internal

  # Sekali jalan (ADR 0007). Dipicu timer systemd di host tiap 6 jam
  # (deploy/systemd/), manual: docker compose ... --profile ops run --rm --no-deps backup
  # Tanpa depends_on: kalau db mati, backup gagal dan alarm berbunyi (bukan menyalakan db).
  # Variabelnya pakai `:-` supaya `up` tetap jalan sebelum akun R2 ada; skrip menolak
  # jalan kalau ada yang kosong.
  backup:
    # Dibangun workflow `images` dari commit yang sama dengan image API, jadi tag-nya sama.
    image: ghcr.io/raditxt/waregos-backup:${API_IMAGE_TAG:?isi API_IMAGE_TAG di .env}
    profiles: ["ops"]
    restart: "no"
    environment:
      PGHOST: db
      PGDATABASE: waregos
      PGUSER: waregos_backup
      PGPASSWORD: ${WAREGOS_BACKUP_PASSWORD:-}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      R2_BUCKET: ${R2_BUCKET:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # Token VPS hanya boleh menulis objek, tidak boleh membuat atau membaca daftar bucket.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      # R2 menolak HEAD ?versionId=... yang dikirim rclone setelah PUT (501 NotImplemented).
      # Ukuran tetap diverifikasi `rclone lsf --format s` di backup.sh.
      RCLONE_CONFIG_R2_NO_HEAD: "true"
    # Plaintext dump hanya di sini (RAM). Ikut dihitung ke mem_limit.
    tmpfs:
      - /work:size=128m,mode=0700,uid=999,gid=999
      # Image postgres punya VOLUME di sini; tanpa ini tiap run dapat volume disk
      # anonim yang bisa ditulis. Ditutup supaya satu-satunya tempat menulis adalah /work.
      - /var/lib/postgresql/data:size=1m,mode=0555
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    networks:
      - internal

networks:
  internal:
    ipam:
      config:
        - subnet: 10.89.10.0/24

volumes:
  db-data: